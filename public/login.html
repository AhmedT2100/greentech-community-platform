<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - GreenTechHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="frontend-overrides.css">
</head>

<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="fas fa-leaf fa-2x text-success"></i>
                            <h2 class="mt-2">Connexion</h2>
                            <p class="text-muted">Accédez à votre tableau de bord GreenTechHub</p>
                        </div>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">Adresse Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control with-icon" id="loginEmail"
                                        placeholder="votre@email.com">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">Mot de passe</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control with-icon" id="loginPassword"
                                        placeholder="Votre mot de passe">
                                </div>
                            </div>
                            <div class="mb-3" id="unlockCodeContainer" style="display: none;">
                                <label for="unlockCode" class="form-label text-danger">Code de sécurité requis</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-shield-alt text-danger"></i></span>
                                    <input type="text" class="form-control with-icon border-danger" id="unlockCode"
                                        placeholder="Entrez le code à 6 chiffres">
                                </div>
                                <div class="form-text text-danger">Consultez votre boîte mail (Gmail)</div>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Se souvenir de moi</label>
                                <a href="#" class="float-end" style="font-size: 0.875rem;">Mot de passe oublié ?</a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3">
                                <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                            </button>
                        </form>
                        <div class="text-center">
                            <p class="mb-0">Pas encore de compte ? <a href="signup.html">Créer un compte</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth-ui.js"></script>
</body>

</html>

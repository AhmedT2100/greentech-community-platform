<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation de mot de passe - GreenTechHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .reset-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        .reset-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .reset-header i {
            font-size: 60px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .reset-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .reset-header p {
            color: #666;
            font-size: 14px;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .btn-reset {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            width: 100%;
            transition: transform 0.2s;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .alert {
            border-radius: 10px;
            border: none;
        }

        .password-strength {
            height: 5px;
            border-radius: 5px;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="reset-container">
        <div class="reset-header">
            <i class="fas fa-key"></i>
            <h1>Réinitialiser votre mot de passe</h1>
            <p>Entrez votre nouveau mot de passe</p>
        </div>

        <div id="alertContainer"></div>

        <!-- Formulaire de réinitialisation -->
        <form id="resetForm">
            <div class="mb-3">
                <label for="newPassword" class="form-label">Nouveau mot de passe</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="newPassword" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('newPassword')">
                        <i class="fas fa-eye" id="newPasswordIcon"></i>
                    </button>
                </div>
                <div class="password-strength" id="passwordStrength"></div>
                <small class="text-muted">Minimum 8 caractères, avec majuscules, minuscules et chiffres</small>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="confirmPassword" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirmPassword')">
                        <i class="fas fa-eye" id="confirmPasswordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-reset">
                <i class="fas fa-check"></i> Réinitialiser le mot de passe
            </button>
        </form>

        <div class="back-link">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Retour à la connexion</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Récupérer le token depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Vérifier le token au chargement
        if (!token) {
            showAlert('danger', 'Token manquant. Veuillez utiliser le lien reçu par email.');
        } else {
            verifyToken();
        }

        // Vérifier la validité du token
        async function verifyToken() {
            try {
                const response = await fetch(`auth_api.php?action=verifyResetToken&token=${token}`);
                const result = await response.json();

                if (!result.success) {
                    showAlert('danger', 'Ce lien de réinitialisation est invalide ou a expiré.');
                    document.getElementById('resetForm').style.display = 'none';
                }
            } catch (error) {
                showAlert('danger', 'Erreur lors de la vérification du token.');
            }
        }

        // Gérer la soumission du formulaire
        document.getElementById('resetForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validation
            if (newPassword.length < 8) {
                showAlert('warning', 'Le mot de passe doit contenir au moins 8 caractères.');
                return;
            }

            if (newPassword !== confirmPassword) {
                showAlert('warning', 'Les mots de passe ne correspondent pas.');
                return;
            }

            if (!isPasswordStrong(newPassword)) {
                showAlert('warning', 'Le mot de passe doit contenir des majuscules, minuscules et chiffres.');
                return;
            }

            // Envoyer la requête
            try {
                const formData = new FormData();
                formData.append('action', 'resetPassword');
                formData.append('token', token);
                formData.append('newPassword', newPassword);

                const response = await fetch('auth_api.php', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    showAlert('success', 'Mot de passe réinitialisé avec succès ! Redirection...');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    showAlert('danger', result.error || 'Erreur lors de la réinitialisation.');
                }
            } catch (error) {
                showAlert('danger', 'Erreur lors de la réinitialisation du mot de passe.');
            }
        });

        // Afficher une alerte
        function showAlert(type, message) {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        // Basculer la visibilité du mot de passe
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId + 'Icon');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Vérifier la force du mot de passe
        document.getElementById('newPassword').addEventListener('input', function () {
            const password = this.value;
            const strengthBar = document.getElementById('passwordStrength');

            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            const colors = ['#ff4444', '#ff8800', '#ffbb00', '#00bb00', '#00ff00'];
            const widths = ['20%', '40%', '60%', '80%', '100%'];

            strengthBar.style.backgroundColor = colors[strength - 1] || '#e0e0e0';
            strengthBar.style.width = widths[strength - 1] || '0%';
        });

        // Vérifier si le mot de passe est fort
        function isPasswordStrong(password) {
            return password.length >= 8 &&
                /[a-z]/.test(password) &&
                /[A-Z]/.test(password) &&
                /[0-9]/.test(password);
        }
    </script>
</body>

</html>
